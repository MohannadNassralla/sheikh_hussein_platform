name: sheikh_hussein_platform
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # --- إضافات Firebase المطلوبة ---
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0

  # --- مكتبة الخطوط الرسمية ---
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # تحديد مسار ملفات الأصول والخط المحلي
  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700